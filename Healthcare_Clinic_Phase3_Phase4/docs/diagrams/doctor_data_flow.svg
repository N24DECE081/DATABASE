<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc">
  <title id="title">Luồng dữ liệu xử lý lịch khám của bác sĩ TiTiMi</title>
  <desc id="desc">Sơ đồ từ hồ sơ và lịch làm việc bác sĩ đến tiếp nhận lịch, phiên khám, hoàn tất, bệnh sử và đơn thuốc.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52708b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173b59" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="1450" fill="#f4f8fb"/>
  <rect x="0" y="0" width="1200" height="178" fill="#173f60"/>
  <text x="72" y="62" fill="#ff8fb3" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="2">TiTiMi · SƠ ĐỒ NGHIỆP VỤ</text>
  <text x="72" y="119" fill="#ffffff" font-family="Arial, Segoe UI, sans-serif" font-size="37" font-weight="700">Luồng dữ liệu · Bác sĩ</text>
  <text x="72" y="153" fill="#d8e7f2" font-family="Arial, Segoe UI, sans-serif" font-size="17">Tiếp nhận lịch được phân công, khám bệnh và lưu kết quả</text>

  <g stroke="#52708b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M600 322V350"/><path d="M600 478V506"/><path d="M600 634V662"/>
    <path d="M600 790V818"/><path d="M600 946V974"/><path d="M600 1102V1130"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, Segoe UI, sans-serif">
    <rect x="170" y="204" width="860" height="118" rx="18" fill="#eef8f4" stroke="#c7e5d8"/>
    <circle cx="220" cy="263" r="25" fill="#d7f0e4"/><text x="220" y="271" text-anchor="middle" fill="#28775c" font-size="20" font-weight="700">1</text>
    <text x="268" y="250" fill="#214c3d" font-size="22" font-weight="700">Bác sĩ có hồ sơ và ca làm trong hệ thống</text>
    <text x="268" y="283" fill="#526c61" font-size="16">user_account → doctor; Admin hoặc bác sĩ ghi ca qua /schedules/new.</text>
    <rect x="811" y="290" width="187" height="24" rx="12" fill="#d7f0e4"/><text x="904" y="307" text-anchor="middle" fill="#28775c" font-size="13">doctor_schedule</text>

    <rect x="170" y="360" width="860" height="118" rx="18" fill="#ffffff" stroke="#d8e4ee"/>
    <circle cx="220" cy="419" r="25" fill="#e7f2fb"/><text x="220" y="427" text-anchor="middle" fill="#17628e" font-size="20" font-weight="700">2</text>
    <text x="268" y="406" fill="#173b59" font-size="22" font-weight="700">Bác sĩ mở danh sách lịch được phân công</text>
    <text x="268" y="439" fill="#546b7e" font-size="16">GET /appointments/ → v_appointment_details, lọc theo doctor_id của tài khoản.</text>
    <rect x="830" y="447" width="168" height="24" rx="12" fill="#e7f2fb"/><text x="914" y="464" text-anchor="middle" fill="#17628e" font-size="13">appointment</text>

    <rect x="170" y="516" width="860" height="118" rx="18" fill="#ffffff" stroke="#d8e4ee"/>
    <circle cx="220" cy="575" r="25" fill="#e7f2fb"/><text x="220" y="583" text-anchor="middle" fill="#17628e" font-size="20" font-weight="700">3</text>
    <text x="268" y="562" fill="#173b59" font-size="22" font-weight="700">Bác sĩ tiếp nhận bệnh nhân</text>
    <text x="268" y="595" fill="#546b7e" font-size="16">POST /appointments/&lt;id&gt;/status → chuyển Scheduled sang Checked-In.</text>
    <rect x="830" y="603" width="168" height="24" rx="12" fill="#fff2df"/><text x="914" y="620" text-anchor="middle" fill="#93621c" font-size="13">appointment.status</text>

    <rect x="170" y="672" width="860" height="118" rx="18" fill="#ffffff" stroke="#d8e4ee"/>
    <circle cx="220" cy="731" r="25" fill="#e7f2fb"/><text x="220" y="739" text-anchor="middle" fill="#17628e" font-size="20" font-weight="700">4</text>
    <text x="268" y="718" fill="#173b59" font-size="22" font-weight="700">Tạo phiên khám cho lịch đã check-in</text>
    <text x="268" y="751" fill="#546b7e" font-size="16">POST /consultations/new/&lt;appointment_id&gt; → consultation_session; phiên đang khám có end_time = NULL.</text>
    <rect x="824" y="759" width="174" height="24" rx="12" fill="#e7f2fb"/><text x="911" y="776" text-anchor="middle" fill="#17628e" font-size="13">session_id</text>

    <rect x="170" y="828" width="860" height="118" rx="18" fill="#fffaf0" stroke="#efd9a7"/>
    <circle cx="220" cy="887" r="25" fill="#ffedc9"/><text x="220" y="895" text-anchor="middle" fill="#94631d" font-size="20" font-weight="700">5</text>
    <text x="268" y="874" fill="#5d471f" font-size="22" font-weight="700">Kết thúc phiên khám</text>
    <text x="268" y="907" fill="#756344" font-size="16">POST /consultations/&lt;session_id&gt;/finish → ghi end_time, tính thời lượng và chuyển appointment sang Completed.</text>

    <rect x="170" y="984" width="860" height="118" rx="18" fill="#ffffff" stroke="#d8e4ee"/>
    <circle cx="220" cy="1043" r="25" fill="#e7f2fb"/><text x="220" y="1051" text-anchor="middle" fill="#17628e" font-size="20" font-weight="700">6</text>
    <text x="268" y="1030" fill="#173b59" font-size="22" font-weight="700">Ghi bệnh sử và kê đơn sau khi hoàn tất</text>
    <text x="268" y="1063" fill="#546b7e" font-size="16">medical_history gắn session_id; prescription và prescription_item gắn phiên khám/thuốc.</text>
    <rect x="807" y="1071" width="191" height="24" rx="12" fill="#e8f6f1"/><text x="902" y="1088" text-anchor="middle" fill="#28775c" font-size="13">chỉ sau Completed</text>

    <rect x="170" y="1140" width="860" height="118" rx="18" fill="#eef8f4" stroke="#c7e5d8"/>
    <circle cx="220" cy="1199" r="25" fill="#d7f0e4"/><text x="220" y="1207" text-anchor="middle" fill="#28775c" font-size="20" font-weight="700">7</text>
    <text x="268" y="1186" fill="#214c3d" font-size="22" font-weight="700">Bệnh nhân xem kết quả của chính mình</text>
    <text x="268" y="1219" fill="#526c61" font-size="16">Patient và bác sĩ được phân công xem phiên khám; Patient chỉ đọc bệnh sử/đơn thuốc thuộc hồ sơ của mình.</text>
  </g>
  <rect x="170" y="1292" width="860" height="94" rx="16" fill="#edf2f7" stroke="#d8e4ee"/>
  <text x="202" y="1328" fill="#173b59" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="700">Nhánh trạng thái theo luật hiện có</text>
  <text x="202" y="1358" fill="#546b7e" font-family="Arial, Segoe UI, sans-serif" font-size="15">Scheduled → Checked-In / Cancelled / No-show · Checked-In → Cancelled / No-show · Doctor chỉ xử lý lịch của mình.</text>
  <text x="600" y="1422" text-anchor="middle" fill="#637b8e" font-family="Arial, Segoe UI, sans-serif" font-size="14">Nguồn: Flask routes, appointment/consultation services, repositories và schema hiện có của đồ án</text>
</svg>
