<svg xmlns="http://www.w3.org/2000/svg" width="980" height="800" viewBox="0 0 980 800" role="img" aria-labelledby="title description">
<title id="title">DOCTOR specialization Disjoint and Total</title>
<desc id="description">DOCTOR is the supertype of GENERAL_PRACTITIONER and SPECIALIST. A double connector and D/T circle indicate total and disjoint specialization. Each specialist belongs to exactly one specialty.</desc>
<rect width="980" height="800" fill="white"/>
<g font-family="Arial,sans-serif" fill="#183d42">
<text x="490" y="37" text-anchor="middle" font-size="23" font-weight="bold">DOCTOR SPECIALIZATION</text>
<text x="490" y="62" text-anchor="middle" font-size="14" fill="#6e8382">Disjoint and Total · Joined-table mapping / Option 8A</text>
<g stroke="#547370" stroke-width="1.6" fill="none">
<path d="M487 256V295M493 256V295"/>
<path d="M471 338L240 400M509 338L740 400"/>
<path d="M740 520V606"/>
</g>
<g stroke="#38766f" stroke-width="1.4">
<rect x="360" y="94" width="260" height="162" rx="2" fill="#eff7f2"/><path d="M360 127H620"/>
<circle cx="490" cy="321" r="26" fill="white"/>
<rect x="90" y="400" width="300" height="120" rx="2" fill="#eff7f2"/><path d="M90 435H390"/>
<rect x="600" y="400" width="280" height="120" rx="2" fill="#eff7f2"/><path d="M600 435H880"/>
<rect x="610" y="606" width="260" height="140" rx="2" fill="#eff7f2"/><path d="M610 641H870"/>
</g>
<g font-size="15">
<text x="490" y="116" text-anchor="middle" font-weight="bold">DOCTOR</text>
<text x="378" y="149">PK DoctorID</text><text x="378" y="171">FK UserID (UNIQUE)</text>
<text x="378" y="192">FullName, Phone, Email</text><text x="378" y="214">LicenseNumber</text>
<text x="490" y="326" text-anchor="middle" font-size="14" font-weight="bold">D / T</text>
<text x="240" y="423" text-anchor="middle" font-weight="bold">GENERAL_PRACTITIONER</text>
<text x="108" y="462">PK / FK DoctorID</text><text x="108" y="495" font-size="12" fill="#6e8382">References DOCTOR(DoctorID)</text>
<text x="740" y="423" text-anchor="middle" font-weight="bold">SPECIALIST</text>
<text x="618" y="462">PK / FK DoctorID</text><text x="618" y="486">FK SpecialtyID</text>
<text x="759" y="543" font-size="13">N</text><text x="759" y="596" font-size="13">1</text>
<text x="763" y="569" font-size="12" fill="#6e8382">belongs to</text>
<text x="740" y="630" text-anchor="middle" font-weight="bold">SPECIALTY</text>
<text x="628" y="669">PK SpecialtyID</text><text x="628" y="693">SpecialtyName</text><text x="628" y="717">Description</text>
</g>
<g font-size="13" fill="#587675">
<text x="90" y="626" font-weight="bold">SPECIALIZATION RULES</text>
<text x="90" y="656">D — Disjoint: a doctor cannot belong to both subtypes.</text>
<text x="90" y="681">T — Total: every doctor belongs to one subtype.</text>
<text x="90" y="706">Double connector: total participation.</text>
<text x="90" y="731">GP does not reference SPECIALTY.</text>
</g>
</g></svg>
